<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080b" />

    <!-- Default metadata for the first paint and for crawlers that do not run
         JavaScript. Every tag marked data-default-meta is removed by the <Seo>
         component once React mounts, so a page never ships two <title> or two
         canonical tags. -->
    <title data-default-meta>PixRock VFX Academy | Professional VFX Training</title>
    <meta data-default-meta
      name="description"
      content="PixRock VFX Academy trains artists for the visual effects industry with production-style workflows, mentor-led reviews and a portfolio built on real project briefs."
    />
    <link data-default-meta rel="canonical" href="https://www.pixrockvfx.com/" />

    <meta data-default-meta property="og:site_name" content="PixRock VFX Academy" />
    <meta data-default-meta property="og:type" content="website" />
    <meta data-default-meta property="og:title" content="PixRock VFX Academy | Professional VFX Training" />
    <meta data-default-meta
      property="og:description"
      content="Learn VFX. Create worlds. Build your career. Industry-focused training in roto, paint, matchmove, compositing, 3D and animation."
    />
    <meta data-default-meta property="og:url" content="https://www.pixrockvfx.com/" />
    <meta data-default-meta property="og:image" content="https://www.pixrockvfx.com/favicon.svg" />
    <meta data-default-meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #f6f7f9; background: #07080b">
        <h1>PixRock VFX Academy</h1>
        <p>
          This site needs JavaScript enabled. Please turn it on, or reach us directly using the contact
          details published on our channels.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
